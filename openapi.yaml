openapi: 3.0.3
info:
  title: Integrated Travel Support Platform API
  description: REST API for unified trip planning, luggage storage discovery & booking, and last-mile transport booking.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: integrated-travel-platform-api
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [traveler, partner_storage, partner_transport, admin, support]
                  default: traveler
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error or email already in use

  /auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid email or password

  /auth/refresh:
    post:
      summary: Refresh JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access and refresh tokens returned
        '401':
          description: Invalid or revoked refresh token

  /auth/logout:
    post:
      summary: Logout user and invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  /payments/intent:
    post:
      summary: Create Payment Intent
      description: Generates an external payment intent reference and client secret for checkout.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - related_type
                - related_id
              properties:
                amount:
                  type: number
                  example: 25.0
                currency:
                  type: string
                  default: USD
                related_type:
                  type: string
                  enum: [storage_booking, transport_booking]
                related_id:
                  type: string
                test_flag:
                  type: string
                  enum: [simulate_decline, simulate_delayed_webhook]
      responses:
        '201':
          description: Payment intent created
        '402':
          description: Payment declined

  /payments/capture:
    post:
      summary: Capture Authorized Payment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider_ref
              properties:
                provider_ref:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Payment captured successfully
        '402':
          description: Payment capture failed

  /payments/refund:
    post:
      summary: Refund Captured Payment
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_id:
                  type: string
                  format: uuid
                provider_ref:
                  type: string
                amount:
                  type: number
                reason:
                  type: string
      responses:
        '200':
          description: Payment refunded successfully

  /payments:
    get:
      summary: List Traveler Payments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: related_type
          schema:
            type: string
            enum: [storage_booking, transport_booking]
      responses:
        '200':
          description: Paginated payment history

  /payments/{id}:
    get:
      summary: Get Payment Record
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment record details

  /payments/webhook:
    post:
      summary: Payment Provider Webhook Handler
      description: Ingests callbacks from external payment gateways (Stripe/Mock) to reconcile delayed authorizations, captures, and charge failures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - event
                - data
              properties:
                event:
                  type: string
                  example: payment_intent.succeeded
                data:
                  type: object
                  required:
                    - provider_ref
                  properties:
                    provider_ref:
                      type: string
                    amount:
                      type: number
                    currency:
                      type: string
  /notifications:
    get:
      summary: List notifications for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
    post:
      summary: Send a data-driven notification (internal / admin dispatch)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - channel
                - template
                - payload
              properties:
                userId:
                  type: string
                  format: uuid
                channel:
                  type: string
                  enum: [email, sms, push]
                template:
                  type: string
                  enum: [BOOKING_CONFIRMED, BOOKING_CANCELLED, PICKUP_REMINDER_1H, PARTNER_STATUS_CHANGED]
                recipient:
                  type: string
                payload:
                  type: object
      responses:
        '201':
          description: Notification rendered, dispatched and recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/{id}/read:
    patch:
      summary: Mark a notification as read / delivered
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/jobs/pickup-reminders:
    post:
      summary: Trigger the 1-hour-before luggage pickup reminder scheduled job
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  windowStart:
                    type: string
                    format: date-time
                  windowEnd:
                    type: string
                    format: date-time
                  processedCount:
                    type: integer
                  remindersDispatched:
                    type: integer

  /partners/{id}/status:
    patch:
      summary: Transition partner account verification status (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, verified, suspended]
                notes:
                  type: string
      responses:
        '200':
          description: Partner account status transitioned and notification dispatched

  /partners/me:
    get:
      summary: Get authenticated partner profile and onboarding status
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Partner account profile details

  /partners/onboard:
    post:
      summary: Submit partner onboarding application (transitions to pending review)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - business_name
                - partner_type
              properties:
                business_name:
                  type: string
                partner_type:
                  type: string
                  enum: [storage, transport, both]
                contact_name:
                  type: string
                contact_phone:
                  type: string
                city:
                  type: string
                address:
                  type: string
                tax_id:
                  type: string
                payout_details_ref:
                  type: string
      responses:
        '201':
          description: Onboarding application submitted successfully

  /partners/locations:
    get:
      summary: List storage locations for verified storage partner
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of storage locations
    post:
      summary: Create a new storage location
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - city
                - lat
                - lng
              properties:
                name:
                  type: string
                address:
                  type: string
                city:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                initial_capacity:
                  type: integer
                  default: 20
                price_per_bag_per_day:
                  type: number
                  default: 6.0
      responses:
        '201':
          description: Storage location created

  /partners/locations/{id}/inventory:
    post:
      summary: Update inventory capacity and price per bag per date
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - total_capacity
                - price_per_bag_per_day
              properties:
                date:
                  type: string
                  format: date
                total_capacity:
                  type: integer
                price_per_bag_per_day:
                  type: number
      responses:
        '200':
          description: Inventory updated successfully

  /partners/bookings:
    get:
      summary: List bookings for partner locations
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [confirmed, checked_in, checked_out, cancelled]
      responses:
        '200':
          description: Paginated partner bookings

  /partners/bookings/{id}/check-in:
    patch:
      summary: Mark luggage storage booking as checked-in (state machine confirmed -> checked_in)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking marked as checked in

  /partners/bookings/{id}/check-out:
    patch:
      summary: Mark luggage storage booking as checked-out (state machine checked_in -> checked_out)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking marked as checked out

  /partners/payouts/summary:
    get:
      summary: Get partner payout financials and settlement ledger
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Financial summary including gross revenue, commission, and available payout

  /partners/payouts/request:
    post:
      summary: Request immediate payout of available balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payout request queued for processing

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [traveler, partner_storage, partner_transport, admin, support]
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        related_type:
          type: string
          enum: [storage_booking, transport_booking]
        related_id:
          type: string
        status:
          type: string
          enum: [intent, authorized, captured, refunded, failed]
        amount:
          type: number
          example: 25.00
        currency:
          type: string
          example: USD
        provider_ref:
          type: string
        idempotency_key:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [email, sms, push]
        template:
          type: string
          enum: [BOOKING_CONFIRMED, BOOKING_CANCELLED, PICKUP_REMINDER_1H, PARTNER_STATUS_CHANGED]
        payload:
          type: object
        status:
          type: string
          enum: [pending, sent, delivered, failed]
        sent_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

