openapi: 3.0.3
info:
  title: Integrated Travel Support Platform API
  description: REST API for unified trip planning, luggage storage discovery & booking, and last-mile transport booking.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: integrated-travel-platform-api
                  timestamp:
                    type: string
                    format: date-time

  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                full_name:
                  type: string
                phone:
                  type: string
                role:
                  type: string
                  enum: [traveler, partner_storage, partner_transport, admin, support]
                  default: traveler
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: User login (rate-limited)
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh JWT access token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New access and refresh tokens returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout user and invalidate refresh token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.

  /auth/me:
    get:
      summary: Get currently authenticated user profile
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/forgot-password:
    post:
      summary: Request password reset link/token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email dispatched if user exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /auth/reset-password:
    post:
      summary: Reset password with token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired reset token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email/request:
    post:
      summary: Request email verification link/token
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Email already verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/verify-email/confirm:
    post:
      summary: Confirm email verification with token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /trips:
    get:
      summary: List user trips with pagination
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [planning, confirmed, in_progress, completed, cancelled]
      responses:
        '200':
          description: Paginated trips list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create a new trip
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - origin_place
                - destination_place
                - start_date
                - end_date
              properties:
                title:
                  type: string
                origin_place:
                  type: string
                destination_place:
                  type: string
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                timezone:
                  type: string
                  default: UTC
                status:
                  type: string
                  enum: [planning, confirmed, in_progress, completed, cancelled]
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          description: Validation error or missing Idempotency-Key

  /trips/{id}:
    get:
      summary: Get trip details including itinerary items and linked bookings
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          description: Trip not found

    put:
      summary: Update trip details
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                origin_place:
                  type: string
                destination_place:
                  type: string
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
                timezone:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: Trip updated successfully
        '404':
          description: Trip not found

    delete:
      summary: Soft-delete a trip
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trip soft-deleted successfully

  /trips/{id}/gaps:
    get:
      summary: Auto-detect arrival-to-checkin and checkout-to-departure gaps in itinerary
      tags:
        - Trips
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of detected gaps with storage recommendations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ItineraryGap'

  /trips/{id}/itinerary:
    post:
      summary: Add an itinerary item to trip
      tags:
        - Itinerary
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - title
                - starts_at
                - ends_at
              properties:
                type:
                  type: string
                  enum: [flight, hotel, activity, storage, transport]
                title:
                  type: string
                location_lat:
                  type: number
                location_lng:
                  type: number
                address:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
                sequence_order:
                  type: integer
                  default: 0
      responses:
        '201':
          description: Itinerary stop created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'

  /trips/{id}/itinerary/{itemId}:
    put:
      summary: Update an itinerary stop
      tags:
        - Itinerary
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                starts_at:
                  type: string
                  format: date-time
                ends_at:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Itinerary stop updated

    delete:
      summary: Remove an itinerary stop
      tags:
        - Itinerary
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Itinerary stop removed

  /location/geocode:
    get:
      summary: Geocode an address to geographic coordinates
      tags:
        - Location
      parameters:
        - in: query
          name: address
          required: true
          schema:
            type: string
          description: The street address or landmark name to geocode
      responses:
        '200':
          description: Geocoded coordinates and address metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /location/reverse-geocode:
    get:
      summary: Reverse geocode latitude and longitude to an address
      tags:
        - Location
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - in: query
          name: lng
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        '200':
          description: Reverse geocoded address metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /location/distance:
    get:
      summary: Calculate distance between two coordinates via query parameters
      tags:
        - Location
      parameters:
        - in: query
          name: origin_lat
          required: true
          schema:
            type: number
        - in: query
          name: origin_lng
          required: true
          schema:
            type: number
        - in: query
          name: dest_lat
          required: true
          schema:
            type: number
        - in: query
          name: dest_lng
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Distance calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceResult'
    post:
      summary: Calculate distance between two coordinates via JSON body
      tags:
        - Location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin
                - destination
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
      responses:
        '200':
          description: Distance calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistanceResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /location/walking-time:
    get:
      summary: Estimate pedestrian walking time via query parameters
      tags:
        - Location
      parameters:
        - in: query
          name: origin_lat
          required: true
          schema:
            type: number
        - in: query
          name: origin_lng
          required: true
          schema:
            type: number
        - in: query
          name: dest_lat
          required: true
          schema:
            type: number
        - in: query
          name: dest_lng
          required: true
          schema:
            type: number
      responses:
        '200':
          description: Walking time and distance estimation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingTimeResult'
    post:
      summary: Estimate pedestrian walking time via JSON body
      tags:
        - Location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin
                - destination
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
      responses:
        '200':
          description: Walking time and distance estimation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalkingTimeResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/locations:
    get:
      summary: Search storage locations near point/time window
      tags:
        - Storage
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
        - in: query
          name: lng
          required: true
          schema:
            type: number
        - in: query
          name: radius_km
          schema:
            type: number
            default: 10
        - in: query
          name: drop_off_at
          schema:
            type: string
            format: date-time
        - in: query
          name: pick_up_at
          schema:
            type: string
            format: date-time
        - in: query
          name: bag_count
          schema:
            type: integer
            default: 1
        - in: query
          name: max_price
          schema:
            type: number
        - in: query
          name: item_size
          schema:
            type: string
            enum: [cabin, large, oversized]
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated storage locations sorted by relevance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageLocation'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /storage/locations/{id}:
    get:
      summary: Get storage location details by ID
      tags:
        - Storage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Location detail with 14-day upcoming inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageLocation'
        '404':
          description: Location not found

  /storage/locations/{id}/inventory:
    post:
      summary: Set/update capacity and pricing per date (partner only)
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inventories
              properties:
                inventories:
                  type: array
                  items:
                    type: object
                    required:
                      - date
                      - total_capacity
                      - price_per_bag_per_day
                    properties:
                      date:
                        type: string
                        example: '2026-10-15'
                      total_capacity:
                        type: integer
                      price_per_bag_per_day:
                        type: number
      responses:
        '200':
          description: Inventory updated successfully
        '403':
          description: Forbidden - Not partner owner

  /storage/bookings:
    get:
      summary: List user storage bookings
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, expired]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StorageBooking'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create idempotent storage booking with atomic capacity check
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - location_id
                - bag_count
                - drop_off_at
                - pick_up_at
              properties:
                location_id:
                  type: string
                  format: uuid
                trip_id:
                  type: string
                  format: uuid
                bag_count:
                  type: integer
                  minimum: 1
                drop_off_at:
                  type: string
                  format: date-time
                pick_up_at:
                  type: string
                  format: date-time
                currency:
                  type: string
                  default: USD
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageBooking'
        '400':
          description: Missing idempotency key or validation error
        '409':
          description: Capacity exceeded or conflict

  /storage/bookings/{id}/confirm:
    post:
      summary: Confirm storage booking
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking confirmed

  /storage/bookings/{id}/check-in:
    post:
      summary: Check in bags at location
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bags checked in

  /storage/bookings/{id}/check-out:
    post:
      summary: Check out bags and complete booking
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bags checked out

  /storage/bookings/{id}/cancel:
    post:
      summary: Cancel booking, restore inventory capacity, and issue refund
      tags:
        - Storage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Booking cancelled and refunded

  /transport/options:
    get:
      summary: Discover transport quotes and transit directions between origin and destination
      tags:
        - Transport
      parameters:
        - in: query
          name: origin_lat
          required: true
          schema:
            type: number
            example: 52.5251
        - in: query
          name: origin_lng
          required: true
          schema:
            type: number
            example: 13.3694
        - in: query
          name: dest_lat
          required: true
          schema:
            type: number
            example: 52.5219
        - in: query
          name: dest_lng
          required: true
          schema:
            type: number
            example: 13.4132
        - in: query
          name: departure_time
          schema:
            type: string
            format: date-time
        - in: query
          name: mode
          schema:
            type: string
            enum: [transit, taxi, rideshare, bike]
      responses:
        '200':
          description: List of available transport options and quotes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransportOptionQuote'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /transport/bookings:
    get:
      summary: List user transport bookings
      tags:
        - Transport
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, in_progress, completed, cancelled]
      responses:
        '200':
          description: Paginated transport bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransportBooking'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      summary: Create transport booking or initiate handoff
      tags:
        - Transport
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transport_option_id
                - origin_lat
                - origin_lng
                - dest_lat
                - dest_lng
                - scheduled_at
              properties:
                transport_option_id:
                  type: string
                origin_lat:
                  type: number
                origin_lng:
                  type: number
                dest_lat:
                  type: number
                dest_lng:
                  type: number
                scheduled_at:
                  type: string
                  format: date-time
                payment_method:
                  type: string
                  default: card
                notes:
                  type: string
      responses:
        '201':
          description: Booking created or handoff redirected
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TransportBooking'
                  - type: object
                    properties:
                      handoff:
                        type: boolean
                        example: true
                      deep_link_url:
                        type: string
                      message:
                        type: string

  /transport/bookings/{id}:
    get:
      summary: Get transport booking details
      tags:
        - Transport
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportBooking'

  /transport/bookings/{id}/cancel:
    post:
      summary: Cancel transport booking and refund payment
      tags:
        - Transport
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Transport booking cancelled

  /transport/handoff:
    post:
      summary: Record partner handoff audit event for deep link navigation
      tags:
        - Transport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - transport_option_id
                - deep_link_url
              properties:
                transport_option_id:
                  type: string
                deep_link_url:
                  type: string
      responses:
        '200':
          description: Handoff logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  handoff:
                    type: boolean
                    example: true
                  deep_link_url:
                    type: string
                  message:
                    type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: BAD_REQUEST
            message:
              type: string
              example: Invalid input parameters
            details:
              type: object
              nullable: true

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        full_name:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [traveler, partner_storage, partner_transport, admin, support]
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Trip:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        origin_place:
          type: string
        destination_place:
          type: string
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        timezone:
          type: string
        status:
          type: string
          enum: [planning, confirmed, in_progress, completed, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ItineraryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [flight, hotel, activity, storage, transport]
        title:
          type: string
        location_lat:
          type: number
          nullable: true
        location_lng:
          type: number
          nullable: true
        address:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        sequence_order:
          type: integer

    ItineraryGap:
      type: object
      properties:
        id:
          type: string
        gapType:
          type: string
          enum: [ARRIVAL_GAP, DEPARTURE_GAP, TIMELINE_GAP]
        title:
          type: string
        description:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        durationFormatted:
          type: string
        recommendedLocation:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
            address:
              type: string
        hasStorageBooked:
          type: boolean
        hasTransportBooked:
          type: boolean
        recommendationAction:
          type: string
          enum: [BOOK_STORAGE, BOOK_TRANSPORT, ALL_SET]

    Coordinates:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180

    GeocodeResult:
      type: object
      required:
        - address
        - formattedAddress
        - lat
        - lng
      properties:
        address:
          type: string
        formattedAddress:
          type: string
        lat:
          type: number
        lng:
          type: number
        city:
          type: string
        country:
          type: string
        postalCode:
          type: string
        placeId:
          type: string

    DistanceResult:
      type: object
      required:
        - origin
        - destination
        - distanceMeters
        - distanceKm
      properties:
        origin:
          $ref: '#/components/schemas/Coordinates'
        destination:
          $ref: '#/components/schemas/Coordinates'
        distanceMeters:
          type: integer
        distanceKm:
          type: number

    WalkingTimeResult:
      type: object
      required:
        - origin
        - destination
        - distanceMeters
        - walkingDurationMinutes
        - walkingDurationSeconds
        - formattedDuration
      properties:
        origin:
          $ref: '#/components/schemas/Coordinates'
        destination:
          $ref: '#/components/schemas/Coordinates'
        distanceMeters:
          type: integer
        walkingDurationMinutes:
          type: integer
        walkingDurationSeconds:
          type: integer
        formattedDuration:
          type: string

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    StorageLocation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        city:
          type: string
        lat:
          type: number
        lng:
          type: number
        distance_km:
          type: number
        distance_meters:
          type: integer
        price_per_bag_per_day:
          type: number
        available_capacity:
          type: integer
        rating:
          type: number
        review_count:
          type: integer
        relevance_score:
          type: number
        max_bag_size:
          type: string
        photos:
          type: array
          items:
            type: string

    StorageBooking:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        location_id:
          type: string
        status:
          type: string
          enum: [pending, confirmed, checked_in, checked_out, cancelled, expired]
        bag_count:
          type: integer
        drop_off_at:
          type: string
          format: date-time
        pick_up_at:
          type: string
          format: date-time
        price_total:
          type: number
        currency:
          type: string

    TransitStep:
      type: object
      properties:
        instruction:
          type: string
        mode:
          type: string
          enum: [walk, subway, bus, tram, train]
        line:
          type: string
          nullable: true
        durationMinutes:
          type: integer
        distanceMeters:
          type: integer
          nullable: true

    TransportOptionQuote:
      type: object
      properties:
        id:
          type: string
        provider_id:
          type: string
          nullable: true
        provider_name:
          type: string
        mode:
          type: string
          enum: [transit, taxi, rideshare, bike]
        estimated_price:
          type: number
        currency:
          type: string
        estimated_duration_min:
          type: integer
        is_direct_bookable:
          type: boolean
        deep_link_url:
          type: string
          nullable: true
        transit_steps:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/TransitStep'

    TransportBooking:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        transport_option_id:
          type: string
        status:
          type: string
          enum: [pending, confirmed, in_progress, completed, cancelled]
        scheduled_at:
          type: string
          format: date-time
        price_total:
          type: number
        currency:
          type: string
        idempotency_key:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

